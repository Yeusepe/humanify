# Purpose: Validate the current Bun + Rust monorepo on pushes and pull requests without pretending deploy automation exists.
# Governing docs:
# - AGENTS.md
# - Implementation Plan.txt
# - docs\architecture.md
# - docs\operations.md
# - docs\release-runbooks.md
# - docs\testing.md
# - docs\workspaces.md
# External references:
# - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# - https://bun.sh/guides/runtime/cicd
# - https://github.com/oven-sh/setup-bun
# - https://github.com/actions-rust-lang/setup-rust-toolchain
# - https://doc.rust-lang.org/cargo/commands/cargo-test.html
# Tests:
# - tooling/verify-workspaces.test.ts

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bun-workspace:
    name: Bun workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun workspace checks
        run: bun run check

      - name: Build Bun workspaces
        run: bun run build

  rust-workspace:
    name: Rust workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting contract
        run: bun run format:check

      - name: Run Rust workspace tests
        run: cargo test --workspace --all-targets

  migration-validation:
    name: Postgres migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: humanify
          POSTGRES_PASSWORD: humanify
          POSTGRES_USER: humanify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humanify -d humanify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUMANIFY_POSTGRES_DB: humanify
      HUMANIFY_POSTGRES_HOST: 127.0.0.1
      HUMANIFY_POSTGRES_PASSWORD: humanify
      HUMANIFY_POSTGRES_PORT: 5432
      HUMANIFY_POSTGRES_USER: humanify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Apply canonical migrations
        run: bun run db:migrate

      - name: Re-run migrations to prove idempotency
        run: bun run db:migrate

      - name: Verify migration status
        run: bun run db:status
