# Governing docs:
# - AGENTS.md
# - Implementation Plan.txt
# - docs\reference-baseline.md
# - docs\data-platform.md
# - docs\local-development.md
# Upstream docs:
# - https://docs.docker.com/reference/cli/docker/compose/up/
# - https://electric-sql.com/docs/guides/installation
# - https://electric-sql.com/docs/api/config
# - https://hub.docker.com/r/pgvector/pgvector
# - https://redis.io/docs/latest/develop/data-types/streams/
# - https://min.io/docs/minio/container/index.html
# - https://qdrant.tech/documentation/
# - https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
# - https://docs.temporal.io/self-hosted-guide/install-temporal-server
# - https://github.com/temporalio/docker-compose

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HUMANIFY_POSTGRES_USER:-humanify}
      POSTGRES_PASSWORD: ${HUMANIFY_POSTGRES_PASSWORD:-humanify}
      POSTGRES_DB: ${HUMANIFY_POSTGRES_DB:-humanify}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${HUMANIFY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - humanify-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HUMANIFY_POSTGRES_USER:-humanify} -d ${HUMANIFY_POSTGRES_DB:-humanify}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "${HUMANIFY_REDIS_PORT:-6379}:6379"
    volumes:
      - humanify-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  electric:
    image: electricsql/electric:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${HUMANIFY_POSTGRES_USER:-humanify}:${HUMANIFY_POSTGRES_PASSWORD:-humanify}@postgres:5432/${HUMANIFY_POSTGRES_DB:-humanify}
      ELECTRIC_SECRET: ${HUMANIFY_ELECTRIC_SECRET:-humanify-electric-dev-secret}
    ports:
      - "${HUMANIFY_ELECTRIC_PORT:-5133}:3000"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HUMANIFY_MINIO_ROOT_USER:-humanify}
      MINIO_ROOT_PASSWORD: ${HUMANIFY_MINIO_ROOT_PASSWORD:-humanify-minio-secret}
    ports:
      - "${HUMANIFY_MINIO_API_PORT:-9000}:9000"
      - "${HUMANIFY_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - humanify-minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__ENABLE_TELEMETRY: "false"
    ports:
      - "${HUMANIFY_QDRANT_HTTP_PORT:-6333}:6333"
      - "${HUMANIFY_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - humanify-qdrant-data:/qdrant/storage

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${HUMANIFY_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${HUMANIFY_GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${HUMANIFY_GRAFANA_PORT:-4300}:3000"
    volumes:
      - humanify-grafana-data:/var/lib/grafana

  temporal-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - humanify-temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
    ports:
      - "${HUMANIFY_TEMPORAL_PORT:-7233}:7233"

  temporal-ui:
    image: temporalio/ui:2.39.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
    ports:
      - "${HUMANIFY_TEMPORAL_UI_PORT:-8233}:8080"

volumes:
  humanify-postgres-data:
  humanify-redis-data:
  humanify-minio-data:
  humanify-qdrant-data:
  humanify-grafana-data:
  humanify-temporal-postgres-data:
